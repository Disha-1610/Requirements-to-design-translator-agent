name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Fixtures are reproducible
        # SOURCE_DATE_EPOCH=0 pins frozen_at to 1970-01-01T00:00:00+00:00 so that
        # make_negative.py produces byte-for-byte identical output on every run.
        # git diff --exit-code will now fail if the fixture *content* changes for
        # a real reason (new test cases, changed hashes) and pass when nothing changed.
        run: |
          SOURCE_DATE_EPOCH=0 python examples/make_negative.py
          git diff --exit-code --stat -- examples/negative examples/happy-path/input/baseline.json
      - name: Tests (replay LLM only, no network)
        run: pytest
